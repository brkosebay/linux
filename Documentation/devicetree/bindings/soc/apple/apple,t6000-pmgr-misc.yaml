%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6000-pmgr-misc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC PMGR Misc Power States

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>

description: |
  Certain Apple SoCs include additional PMGR power states that are controlled
  via a different "misc" control block. This includes the fabric and memory
  controller states. On S8000/S8003 it is the combined SoC and memory
  performance state, with the per-state records that follow it, and the
  registers of PMGR's voltage sequencer.

properties:
  compatible:
    enum:
      - apple,s8000-pmgr-misc
      - apple,t6000-pmgr-misc
      - apple,t6020-pmgr-misc

  reg:
    maxItems: 2

  reg-names:
    maxItems: 2

required:
  - compatible
  - reg
  - reg-names

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,s8000-pmgr-misc
    then:
      properties:
        reg-names:
          items:
            - const: soc-ps
            - const: volman
    else:
      properties:
        reg-names:
          items:
            - const: fabric-ps
            - const: dcs-ps

additionalProperties: false

examples:
  - |
    power-management@8e20c000 {
        compatible = "apple,t6000-pmgr-misc";
        reg = <0x8e20c000 0x400>,
              <0x8e20c800 0x400>;
        reg-names = "fabric-ps", "dcs-ps";
    };
